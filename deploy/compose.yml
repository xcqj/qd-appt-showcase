# 号源 QueueDepth · 演示/部署编排 · 应用层（S16.1）
#
# 本文件只描述「四个应用是什么」：镜像、环境变量、依赖顺序、健康检查。
# 三类差异全部外置，靠 -f 叠加（后者覆盖前者）：
#
#   compose.deps.yml   MySQL / Redis / MinIO
#   compose.wsl.yml    wsl 目标：宿主端口 18082/18083/18084，依赖只绑 127.0.0.1
#   compose.cloud.yml  cloud 目标（S16.2 验收前不启用）：依赖不发布端口 + 资源上限
#   compose.build.yml  仅本地：四个 build: 段（部署机不 clone 源码，永远不带它）
#
# 标准调用（deploy.sh / demo.sh 内部都这么拼）：
#   docker compose -f compose.yml -f compose.deps.yml -f compose.wsl.yml up -d --wait
#
# 项目名**不写在这里**：由脚本注入 COMPOSE_PROJECT_NAME（qd-appt-demo / qd-appt-prod），
# 否则两个目标会互相 down 掉对方的容器。容器名前缀用 ${APPT_CONTAINER_PREFIX}，与项目名同步。

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # SnailJob 服务端（S14 追加）：控制台 8800 / 客户端 gRPC 17888
  # 与业务同库：sj_* 表与任务种子由 init-db.sh --full 导入
  snailjob:
    image: ${APPT_REGISTRY:-ghcr.io/xcqj}/appt-snailjob:${APPT_TAG:?APPT_TAG 必填，形如 v0.1.0}
    container_name: ${APPT_CONTAINER_PREFIX:-qd-appt-demo}-snailjob
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_BOOT_ADMIN_CLIENT_ENABLED: "false"
      SPRING_DATASOURCE_URL: ${APPT_SNAILJOB_DB_URL:-jdbc:mysql://mysql:3306/appt?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
      SPRING_DATASOURCE_USERNAME: ${APPT_DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${APPT_DB_PASSWORD:-root}
      SNAIL_JOB_SERVER_PORT: "17888"
      APPT_TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL --max-time 3 http://127.0.0.1:8800/snail-job/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    logging: *logging

  api:
    image: ${APPT_REGISTRY:-ghcr.io/xcqj}/appt-api:${APPT_TAG}
    container_name: ${APPT_CONTAINER_PREFIX:-qd-appt-demo}-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod,docker
      APPT_SERVER_PORT: "8082"
      APPT_TZ: Asia/Shanghai
      APPT_DB_URL: ${APPT_DB_URL:-jdbc:mysql://mysql:3306/appt?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true}
      APPT_DB_USERNAME: ${APPT_DB_USERNAME:-root}
      APPT_DB_PASSWORD: ${APPT_DB_PASSWORD:-root}
      APPT_REDIS_HOST: ${APPT_REDIS_HOST:-redis}
      APPT_REDIS_PORT: ${APPT_REDIS_PORT:-6379}
      APPT_REDIS_PASSWORD: ${APPT_REDIS_PASSWORD:-ruoyi123}
      APPT_REDIS_DATABASE: ${APPT_REDIS_DATABASE:-1}
      # 定时任务执行器：连同网络的 snailjob 服务端（namespace=dev 对应种子里的任务）
      APPT_SNAILJOB_ENABLED: ${APPT_SNAILJOB_ENABLED:-true}
      APPT_SNAILJOB_SERVER_HOST: snailjob
      APPT_SNAILJOB_SERVER_PORT: "17888"
      APPT_SNAILJOB_NAMESPACE: ${APPT_SNAILJOB_NAMESPACE:-dev}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      snailjob:
        condition: service_healthy
    healthcheck:
      # 匿名接口探活：比 TCP 更接近「真的能用了」（镜像内已装 curl）
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://127.0.0.1:8082/appt/public/campus/list >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    logging: *logging

  admin:
    image: ${APPT_REGISTRY:-ghcr.io/xcqj}/appt-admin:${APPT_TAG}
    container_name: ${APPT_CONTAINER_PREFIX:-qd-appt-demo}-admin
    restart: unless-stopped
    environment:
      APPT_API_UPSTREAM: http://api:8082
      # 「运维对账 → 任务调度中心」iframe：指向 compose 内的 snailjob 控制台
      APPT_SNAILJOB_UPSTREAM: ${APPT_SNAILJOB_UPSTREAM:-http://snailjob:8800}
    extra_hosts:
      # 备选：想改看宿主机上的 SnailJob 时，把 APPT_SNAILJOB_UPSTREAM 指到 host.docker.internal:8800
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    logging: *logging

  h5:
    image: ${APPT_REGISTRY:-ghcr.io/xcqj}/appt-h5:${APPT_TAG}
    container_name: ${APPT_CONTAINER_PREFIX:-qd-appt-demo}-h5
    restart: unless-stopped
    environment:
      APPT_API_UPSTREAM: http://api:8082
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    logging: *logging

# bucket 初始化不单列服务：minio 镜像自带 mc，脚本直接 `exec` 进容器执行，
# 省掉一次额外的镜像拉取（minio/mc 在部分镜像源不可用）。
